name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write   # needed to create/upload to a release

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ufbt
        run: pip install --upgrade ufbt

      - name: Sync ufbt SDK (release channel)
        working-directory: flipper_app
        run: ufbt update --channel=release

      - name: Build FAP
        working-directory: flipper_app
        run: ufbt

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p release
          fap=$(find flipper_app/dist -maxdepth 3 -name '*.fap' -print -quit)
          test -n "$fap" || { echo "::error::no .fap"; exit 1; }
          cp "$fap" "release/pulse_rhythm.fap"

          # bundle the editor as a single zip a user can drop on any host
          (cd editor && zip -qr "../release/pulse-editor.zip" .)

          # also bundle the built-in songs as standalone .frgl files
          (cd flipper_app/songs && zip -qr "../../release/pulse-songs.zip" *.frgl)

          # checksum everything
          (cd release && sha256sum * > SHA256SUMS)
          ls -lh release/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/*

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Pulse ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          files: |
            release/pulse_rhythm.fap
            release/pulse-editor.zip
            release/pulse-songs.zip
            release/SHA256SUMS
          body: |
            Pulse — Flipper Zero rhythm game.

            **Install the FAP**
            Copy `pulse_rhythm.fap` to `/ext/apps/Games/` on your Flipper.

            **Editor**
            Unzip `pulse-editor.zip` and open `index.html` in any browser
            (desktop or mobile).

            **Songs**
            `pulse-songs.zip` ships the four built-in tracks as standalone
            `.frgl` files for editing in the editor.
